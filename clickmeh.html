<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>click meh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      /* CHANGE YOUR BACKGROUND IMAGE HERE */
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
        url("https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/Screenshot%202026-09-03%20194834.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .content {
      width: 90%;
      max-width: 900px;
      padding: 40px 20px;
    }

    .text {
      margin-bottom: 35px;
    }

    .text h1 {
      font-size: 3rem;
      margin: 0 0 15px;
    }

    .text p {
      font-size: 1.25rem;
      margin: 0;
    }

    .pictures {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .pictures img {
      width: 300px;
      height: 220px;
      object-fit: cover;

      border-radius: 12px;
      border: 3px solid white;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    /* Makes it look good on phones too */
    @media (max-width: 700px) {
      .text h1 {
        font-size: 2.2rem;
      }

      .pictures img {
        width: 100%;
        max-width: 320px;
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <main class="content">

    <!-- CUSTOMIZE YOUR TEXT HERE -->
    <div class="text">
      <h1>frick you guys</h1>
      <p>
        yooooo whats up boiiiiiiiiiiiiiiiiiiiiii i fricking fixed the fricking thing so frick you jack.
        also the new universe gonna be awesome too bad you guys arent getting it 😂🤣
        
        also please don't jump me - THE tasdiam
      </p>
    </div>

    <!-- CHANGE THESE TWO PICTURES -->
    <div class="pictures">
      <img
        src="https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/Screenshot%20from%202026-07-11%2020-58-12.png"
        alt="Picture 1"
      >

      <img
        src="https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/Screenshot%20from%202026-07-15%2003-28-14.png"
        alt="Picture 2"
      >
    </div>

  </main>

</body>
</html>
