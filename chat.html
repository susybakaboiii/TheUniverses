<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangout</title>
<style>
/* Colors match The Universe. When this page runs as a Universe tab it also
   picks up whatever Universe theme is active (see applyUniverseTheme). */
:root{
  --bg:#111214; --bg2:#141619; --bg3:#1b1d21; --border:#2c3036;
  --text:#eeeeee; --muted:#7d838c; --accent:#8b909a;
  --on-accent:#111214; --who-l:68%; --ok:#3fb950; --danger:#ff7b7b;
  color-scheme:dark;
}
html{
  --sb-thumb:color-mix(in srgb, var(--muted) 55%, var(--bg));
  scrollbar-color:var(--sb-thumb) var(--bg);
}
@supports not (scrollbar-color:auto){
  ::-webkit-scrollbar{width:12px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:8px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:700}

/* ---------- buttons & fields (same look as The Universe) ---------- */
.primary,.ghost,.danger{
  font-size:13px;color:var(--text);background:var(--bg3);
  border:1px solid var(--border);border-radius:7px;padding:8px 14px;
}
.primary:hover,.ghost:hover,.danger:hover{border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{opacity:.6;cursor:default;filter:none}
.danger{color:var(--danger)}
.mini{padding:5px 10px;font-size:12px;flex:none}
.danger-text{color:var(--danger)}
.icon{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid transparent}
.icon:hover{color:var(--text);background:var(--bg3);border-color:var(--border)}
.icon.sm{width:24px;height:24px}
.field{
  width:100%;font-size:13px;color:var(--text);background:var(--bg3);
  border:1px solid var(--border);border-radius:7px;padding:8px 11px;outline:none;min-width:0;
}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px}
.inline .field{flex:1}

.logo{font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--text);white-space:nowrap}
.logo b{font-weight:800;color:var(--accent)}

/* ---------- sign in ---------- */
#auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{width:min(360px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.card .logo{font-size:24px;text-align:center}
.tagline{text-align:center;margin:-6px 0 4px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;font-size:13px;color:var(--muted);border:1px solid transparent;border-radius:7px;padding:7px 12px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--bg3);color:var(--text);border-color:var(--border)}
.card label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}

/* ---------- layout ---------- */
#app{display:flex;height:100%;height:100dvh}
#side{width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);min-height:58px}
.side-scroll{flex:1;overflow-y:auto;padding:8px}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-top:1px solid var(--border)}
.side-foot .who-me{flex:1;min-width:0}
.side-foot .who-me div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 6px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;border:1px solid transparent}
.item:hover{background:var(--bg3)}
.item.on{background:var(--bg3);border-color:var(--border)}
.meta{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.hint{font-size:12px;color:var(--muted);padding:4px 8px 8px}
.req{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);margin-bottom:6px}

.avatar{
  position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;user-select:none;
  background:linear-gradient(150deg,hsl(var(--h,220) 70% 48%),hsl(calc(var(--h,220) + 40) 72% 34%));
}
.avatar.sq{border-radius:8px}
.avatar.global{background:var(--bg3);color:var(--accent);border:1px solid var(--border);font-size:17px}
.avatar.dot::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg2)}
.avatar.big{width:64px;height:64px;font-size:26px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);min-height:58px}
.chat-head .title{flex:1;min-width:0}
.chat-head .title > *{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.back{display:none;margin-left:-6px}
.banner{background:var(--bg3);color:var(--muted);border-bottom:1px solid var(--border);text-align:center;font-size:12px;padding:5px}

#msgs{flex:1;overflow-y:auto;padding:12px 16px 10px;display:flex;flex-direction:column}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.row.cont{margin-top:2px}
.row.mine{justify-content:flex-end}
.row .avatar{width:30px;height:30px;font-size:13px;cursor:pointer}
.av-spacer{width:30px;flex:none}
.body{display:flex;flex-direction:column;align-items:flex-start;max-width:min(580px,80%);min-width:0}
.row.mine .body{align-items:flex-end}
.who{font-size:12px;font-weight:700;color:hsl(var(--h) 70% var(--who-l));padding:0 4px 2px}
.who:hover{text-decoration:underline}
.bubble{background:var(--bg3);border:1px solid var(--border);padding:7px 11px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.row:not(.mine) .bubble{border-bottom-left-radius:3px}
.row.mine .bubble{background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.time{float:right;font-size:10.5px;opacity:.6;margin:7px -3px -4px 10px;white-space:nowrap}
.day{align-self:center;margin:16px 0 4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg3);border:1px solid var(--border);padding:2px 10px;border-radius:999px}
.sys{align-self:center;margin:10px 0 2px;font-size:12px;color:var(--muted);text-align:center;max-width:90%}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.empty .big-emoji{font-size:32px;margin-bottom:6px}
.empty .b{color:var(--text)}

#composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border)}
#input{flex:1;resize:none;max-height:160px;min-height:40px;padding:9px 13px;border:1px solid var(--border);background:var(--bg3);border-radius:9px;outline:none;line-height:1.4}
#input:focus{border-color:var(--accent)}
#input::placeholder{color:var(--muted)}
.send{width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send:hover{filter:brightness(1.1)}

/* ---------- modal & toasts ---------- */
#modalWrap{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:min(420px,100%);max-height:min(640px,88vh);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 10px 6px 18px}
.m-head h2{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-body{padding:6px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.sec2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.person{display:flex;align-items:center;gap:10px;padding:6px 0}
.person input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none}
label.person{cursor:pointer}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
#toasts{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:opacity .3s,transform .3s;text-align:center}
.toast.bad{color:var(--danger)}
.toast.out{opacity:0;transform:translateY(6px)}

/* ---------- photos, videos & GIFs ---------- */
#composer{flex-wrap:wrap}
#tray{flex-basis:100%;display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
#tray:empty{display:none}
.chip{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg3);flex:none}
.chip img,.chip video{width:100%;height:100%;object-fit:cover;display:block}
.chip .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.chip .tag{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:0 4px}
.tool{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid transparent}
.tool:hover{color:var(--text);background:var(--bg3);border-color:var(--border)}
.tool.gif{font-size:11px;font-weight:800;letter-spacing:.04em}
.media{display:block;position:relative;border-radius:7px;overflow:hidden;background:var(--bg2);max-width:100%}
.media img,.media video{display:block;width:100%;height:100%;object-fit:cover}
.media img{cursor:zoom-in}
.media.gone{display:grid;place-items:center;color:var(--muted);font-size:12px;padding:18px 12px;width:220px!important;aspect-ratio:auto!important}
.bubble.has-media{padding:4px}
.bubble.has-media .cap{padding:5px 7px 2px}
.bubble.has-media > .time{margin:5px 5px 1px 10px}
.time.over{position:absolute;right:6px;bottom:6px;float:none;margin:0;background:rgba(0,0,0,.55);color:#fff;opacity:1;border-radius:6px;padding:1px 6px;pointer-events:none}
.gif-badge{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 5px;pointer-events:none}
.progress{height:4px;width:180px;max-width:100%;border-radius:2px;margin-top:6px;overflow:hidden;background:color-mix(in srgb,var(--on-accent) 25%,transparent)}
.progress i{display:block;height:100%;width:0;background:var(--on-accent);transition:width .2s}
#main{position:relative}
#main.drag::after{content:"Drop to add photos or videos";position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-weight:700;font-size:15px;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 75%,transparent);outline:2px dashed var(--accent);outline-offset:-10px}
.modal.wide{width:min(560px,100%)}
.gif-grid{columns:3 140px;column-gap:6px}
.gif-grid img{width:100%;display:block;margin-bottom:6px;border-radius:6px;cursor:pointer;background:var(--bg3);break-inside:avoid}
.gif-grid img:hover{outline:2px solid var(--accent);outline-offset:-2px}
.credit{font-size:11px;color:var(--muted);text-align:right}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:calc(100vh - 40px);object-fit:contain;border-radius:6px}
#lightbox a{position:absolute;top:14px;right:14px;cursor:pointer;text-decoration:none}

@media (max-width:760px){
  #side{width:100%;border-right:0}
  #app:not(.in-chat) #main{display:none}
  #app.in-chat #side{display:none}
  .back{display:grid}
  .body{max-width:84%}
}
</style>
</head>
<body>

<!-- ============ Sign in ============ -->
<div id="auth">
  <form class="card" id="authForm" autocomplete="on">
    <div class="logo">Hang<b>out</b></div>
    <p class="tagline">Talk to everyone, or just your people.</p>
    <div class="tabs"><button type="button" data-mode="login" class="on">Log in</button><button type="button" data-mode="register">Sign up</button></div>
    <label>Username<input class="field" id="aUser" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" required></label>
    <label>Password<input class="field" id="aPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="authErr"></div>
    <button class="primary" id="authBtn">Log in</button>
  </form>
</div>

<!-- ============ App ============ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="side-head"><div class="logo">Hang<b>out</b></div></div>
    <div class="side-scroll">
      <div id="globalSlot"></div>
      <div class="sec"><span>Friends</span><button class="icon sm" id="addFriendBtn" title="Add a friend"></button></div>
      <div id="requests"></div>
      <div id="friendList"></div>
      <div class="sec"><span>Groups</span><button class="icon sm" id="newGroupBtn" title="New group"></button></div>
      <div id="groupList"></div>
    </div>
    <div class="side-foot">
      <span id="meAv"></span>
      <div class="who-me"><div class="b" id="meName"></div><div class="small muted" id="connText">Online</div></div>
      <button class="icon" id="logoutBtn" title="Log out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </aside>

  <main id="main">
    <header class="chat-head">
      <button class="icon back" id="backBtn" title="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="chatAv"></span>
      <div class="title"><button class="b" id="chatTitle"></button><button class="small muted" id="chatSub"></button></div>
      <button class="icon" id="infoBtn" title="Details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    </header>
    <div class="banner hidden" id="banner">Reconnecting…</div>
    <div id="msgs"></div>
    <form id="composer">
      <div id="tray"></div>
      <input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>
      <button type="button" class="tool" id="attachBtn" title="Send photos or videos"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
      <button type="button" class="tool gif hidden" id="gifBtn" title="Send a GIF">GIF</button>
      <textarea id="input" rows="1" placeholder="Message" maxlength="2000"></textarea>
      <button class="send" title="Send"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
    </form>
  </main>
</div>

<div id="modalWrap" class="hidden"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
/* ======================================================================
   SERVER — the one server everybody connects to.
   Start your tunnel with:   cloudflared tunnel --url http://localhost:3000
   then paste the https://....trycloudflare.com address it prints here.
   (https:// is fine, it gets turned into wss:// automatically.)
   ====================================================================== */
const SERVER_URL = "https://your-tunnel.trycloudflare.com";

/* Optional: a JSON file like  { "server": "https://....trycloudflare.com" }
   If set, the address is read from there first, so you can switch tunnels by
   editing that one file instead of this page. Leave "" to just use SERVER_URL. */
const SERVER_CONFIG_URL = "";
/* ===================================================================== */

(() => {
'use strict';

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = String(v);
    else if (k === 'html') e.innerHTML = v;           // only ever used with constant icons
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const ICON = {
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  xs: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};
$('#addFriendBtn').innerHTML = ICON.plus;
$('#newGroupBtn').innerHTML = ICON.plus;

const isMobile = () => matchMedia('(max-width: 760px)').matches;
const hue = s => { let h = 0; for (const c of String(s).toLowerCase()) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function avatar(name, cls = '') {
  return el('span', { class: 'avatar ' + cls, style: `--h:${hue(name)}`, text: (String(name)[0] || '?').toUpperCase() });
}
const dayKey = ts => new Date(ts).toDateString();
const hm = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function dayLabel(ts) {
  const d = new Date(ts), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

/* ---------- state ---------- */
const S = {
  server: '', ws: null, queue: [], connected: false,
  token: null, me: null, st: null, online: new Set(),
  active: 'global', msgs: {}, unread: {}, hiddenCount: 0, entered: false, mode: 'login',
  features: {}, httpBase: '', tray: [], pending: [], atBottom: true,
};
function normServer(s) {
  s = (s || '').trim() || 'localhost:3000';
  s = s.replace(/^http(s?):\/\//i, 'ws$1://');
  if (!/^wss?:\/\//i.test(s)) s = 'ws://' + s;
  return s.replace(/\/+$/, '');
}
const tokenKey = () => 'hangout.token';

/* ---------- connection ---------- */
function connect() {
  if (S.ws && S.ws.readyState <= 1) return;
  if (!S.server) { S.queue = []; authBusy(false); authErr(S.serverProblem || 'No server address is set.'); return; }
  let ws;
  try { ws = new WebSocket(S.server); }
  catch { S.queue = []; authBusy(false); authErr(`"${S.server}" doesn't look like a valid server address.`); return; }

  const chat = S.active;
  const q = el('input', { class: 'field', placeholder: 'Search GIFs', maxlength: 50, autocomplete: 'off', spellcheck: 'false' });
  const status = el('div', { class: 'hint', style: 'padding:0' });
  const grid = el('div', { class: 'gif-grid' });
  let seq = 0, timer;
  const load = async () => {
    const my = ++seq;
    status.textContent = 'Loading…';
    try {
      const r = await fetch(`${S.httpBase}/gifs?q=${encodeURIComponent(q.value.trim())}`, { headers: { 'X-Token': S.token || '' } });
      const j = await r.json().catch(() => ({}));
      if (my !== seq) return;
      if (!r.ok) throw new Error(j.error || 'GIF search failed.');
      grid.textContent = '';
      status.textContent = j.results.length ? '' : 'No GIFs found.';
      for (const g of j.results) {
        grid.append(el('img', {
          src: g.preview, alt: 'GIF', loading: 'lazy', style: g.w && g.h ? `aspect-ratio:${g.w}/${g.h}` : null,
          onclick: () => { send({ t: 'send', chat, text: '', media: { giphy: g.id } }); closeModal(); },
        }));
      }
    } catch (e) { if (my === seq) status.textContent = e.message; }
  };
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 400); });
  openModal('Send a GIF', q, status, grid, el('div', { class: 'credit', text: 'Powered by GIPHY' }));
  $('#modal').classList.add('wide');
  load();
}

/* ---------- modals ---------- */
function openModal(title, ...content) {
  $('#modal').replaceChildren(
    el('div', { class: 'm-head' }, el('h2', { text: title }), el('button', { class: 'icon', title: 'Close', html: ICON.x, onclick: closeModal })),
    el('div', { class: 'm-body' }, ...content));
  $('#modalWrap').classList.remove('hidden');
  const f = $('#modal input:not([type=checkbox])');
  if (f && !isMobile()) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modalWrap').classList.add('hidden'); $('#modal').textContent = ''; $('#modal').className = 'modal'; }
$('#modalWrap').addEventListener('mousedown', e => { if (e.target.id === 'modalWrap') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeLightbox(); } });

function relationButton(n) {
  if (n === S.me) return el('span', { class: 'muted small', text: 'You' });
  if (isFriend(n)) return el('button', { class: 'mini ghost', text: 'Message', onclick: () => { closeModal(); openChat(friendChat(n)); } });
  if (S.st.incoming.includes(n)) return el('button', { class: 'mini primary', text: 'Accept', onclick: () => { send({ t: 'friend_respond', from: n, accept: true }); closeModal(); } });
  if (S.st.outgoing.includes(n)) return el('span', { class: 'muted small', text: 'Requested' });
  return el('button', { class: 'mini primary', text: 'Add friend', onclick: e => {
    send({ t: 'friend_request', to: n });
    e.currentTarget.replaceWith(el('span', { class: 'muted small', text: 'Requested' }));
  } });
}
function personRow(n, extra) {
  return el('div', { class: 'person' }, avatar(n, S.online.has(n) ? 'dot' : ''),
    el('div', { class: 'meta' }, el('div', { class: 'name', text: n + (n === S.me ? ' (you)' : '') }), extra ? el('div', { class: 'sub', text: extra }) : null),
    relationButton(n));
}

function addFriendModal() {
  const inp = el('input', { class: 'field', placeholder: 'Their username', maxlength: 20, autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  const form = el('form', { class: 'inline', onsubmit: e => {
    e.preventDefault();
    const v = inp.value.trim();
    if (v) { send({ t: 'friend_request', to: v }); closeModal(); }
  } }, inp, el('button', { class: 'primary', text: 'Send' }));
  const people = [...S.online].filter(n => n !== S.me && !isFriend(n));
  openModal('Add a friend', form,
    people.length ? el('div', { class: 'sec2', text: 'Online now' }) : null,
    people.map(n => personRow(n)));
}

function newGroupModal() {
  const name = el('input', { class: 'field', placeholder: 'Group name', maxlength: 40, required: true });
  const boxes = S.st.friends.map(f => {
    const cb = el('input', { type: 'checkbox', value: f.name });
    return { cb, row: el('label', { class: 'person' }, avatar(f.name, S.online.has(f.name) ? 'dot' : ''), el('div', { class: 'meta name', text: f.name }), cb) };
  });
  const form = el('form', { class: 'stack', onsubmit: e => {
    e.preventDefault();
    const n = name.value.trim();
    if (!n) return;
    send({ t: 'group_create', name: n, members: boxes.filter(b => b.cb.checked).map(b => b.cb.value) });
    closeModal();
  } }, name,
    el('div', { class: 'sec2', text: 'Add friends' }),
    boxes.length ? boxes.map(b => b.row) : el('div', { class: 'hint', style: 'padding:0', text: "You don't have any friends added yet. You can still make the group and add people later." }),
    el('button', { class: 'primary', text: 'Create group' }));
  openModal('New group', form);
}

function infoModal(c) {
  const i = chatInfo(c);
  if (!i) return;
  if (i.kind === 'global') {
    const names = [...S.online].sort((a, b) => a.localeCompare(b));
    return openModal('Everyone', el('div', { class: 'muted small', text: 'The big room — every account can read and post here.' }),
      el('div', { class: 'sec2', text: `Online now (${names.length})` }), names.map(n => personRow(n)));
  }
  if (i.kind === 'dm') return userModal(i.title);

  const g = i.group, owner = g.owner === S.me, parts = [];
  if (owner) {
    const nameIn = el('input', { class: 'field', value: g.name, maxlength: 40 });
    parts.push(el('form', { class: 'inline', onsubmit: e => {
      e.preventDefault();
      if (nameIn.value.trim()) { send({ t: 'group_rename', group: g.id, name: nameIn.value.trim() }); closeModal(); }
    } }, nameIn, el('button', { class: 'ghost', text: 'Rename' })));
  }
  parts.push(el('div', { class: 'sec2', text: `Members (${g.members.length})` }));
  for (const n of g.members) {
    const row = personRow(n, n === g.owner ? 'Owner' : null);
    if (owner && n !== S.me) {
      row.append(el('button', { class: 'mini ghost danger-text', text: 'Remove', onclick: () => {
        if (confirm(`Remove ${n} from ${g.name}?`)) { send({ t: 'group_kick', group: g.id, user: n }); closeModal(); }
      } }));
    }
    parts.push(row);
  }
  const addable = S.st.friends.map(f => f.name).filter(n => !g.members.includes(n));
  parts.push(el('div', { class: 'sec2', text: 'Add people' }));
  if (addable.length) {
    const sel = el('select', { class: 'field' }, addable.map(n => el('option', { value: n, text: n })));
    parts.push(el('form', { class: 'inline', onsubmit: e => { e.preventDefault(); send({ t: 'group_add', group: g.id, user: sel.value }); closeModal(); } },
      sel, el('button', { class: 'primary', text: 'Add' })));
  } else parts.push(el('div', { class: 'hint', style: 'padding:0', text: 'All your friends are already here. Add more friends to invite them.' }));
  parts.push(el('button', { class: 'danger', style: 'margin-top:12px', text: 'Leave group', onclick: () => {
    if (confirm(`Leave ${g.name}?`)) { send({ t: 'group_leave', group: g.id }); closeModal(); }
  } }));
  openModal(g.name, ...parts);
}

function userModal(n) {
  const on = S.online.has(n);
  const parts = [el('div', { class: 'profile' }, avatar(n, 'big' + (on ? ' dot' : '')), el('div', { class: 'muted', text: on ? 'Online' : 'Offline' }), relationButton(n))];
  if (isFriend(n)) {
    parts.push(el('button', { class: 'danger', style: 'margin-top:14px', text: 'Remove friend', onclick: () => {
      if (confirm(`Remove ${n} from your friends?`)) { send({ t: 'friend_remove', user: n }); closeModal(); }
    } }));
  }
  openModal(n, ...parts);
}

function toast(t, bad) {
  const n = el('div', { class: 'toast' + (bad ? ' bad' : ''), text: t });
  $('#toasts').append(n);
  setTimeout(() => n.classList.add('out'), 2800);
  setTimeout(() => n.remove(), 3200);
}

/* ---------- theme: follow The Universe ---------- */
// When this page runs inside The Universe it shares its storage, so it can read
// the active theme and update live when someone picks a new one in Settings.
const THEME_VARS = ['bg', 'bg2', 'bg3', 'border', 'text', 'muted', 'accent'];
function hexLum(hex) {
  let h = String(hex || '').trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  if (isNaN(n)) return null;
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
}
function applyUniverseTheme() {
  let t = null;
  try { t = JSON.parse(localStorage.getItem('universe-active-theme') || 'null'); } catch {}
  const root = document.documentElement;
  for (const k of THEME_VARS) {
    if (t && /^#[0-9a-f]{3,8}$/i.test(t[k] || '')) root.style.setProperty('--' + k, t[k]);
    else root.style.removeProperty('--' + k);
  }
  const css = getComputedStyle(root);
  const bgLum = hexLum(css.getPropertyValue('--bg'));
  const light = bgLum != null && bgLum > 0.5;
  root.style.colorScheme = light ? 'light' : 'dark';
  root.style.setProperty('--who-l', light ? '36%' : '68%');
  const accLum = hexLum(css.getPropertyValue('--accent'));
  root.style.setProperty('--on-accent', accLum != null && accLum > 0.55 ? '#111214' : '#ffffff');
}
applyUniverseTheme();
addEventListener('storage', e => { if (e.key === 'universe-active-theme' || e.key === null) applyUniverseTheme(); });

/* ---------- start ---------- */
async function resolveServer() {
  let addr = '';
  if (SERVER_CONFIG_URL) {
    try {
      const res = await fetch(SERVER_CONFIG_URL, { cache: 'no-store' });
      if (res.ok) { const j = await res.json(); addr = String((j && (j.server || j.url)) || ''); }
    } catch {}
  }
  if (!addr && SERVER_URL && !/your-tunnel/i.test(SERVER_URL)) addr = SERVER_URL;
  // Page opened straight from server.js (http://localhost:3000)? Use that.
  if (!addr && /^https?:$/.test(location.protocol)) addr = location.origin;
  if (!addr) { S.serverProblem = 'No chat server is set yet. Put your tunnel address in SERVER_URL at the top of chat.html.'; return; }
  S.server = normServer(addr);
  S.httpBase = S.server.replace(/^ws/i, 'http');
}
S.ready = resolveServer();
setMode('login');
S.token = store.get(tokenKey());
if (S.token) { authBusy(true, 'Signing you in…'); S.ready.then(connect); }
})();
</script>
