<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Universe</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg, #111214);
    color:var(--text, #ddd);
    font:14px system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  #bar{
    position:sticky; top:0; z-index:4;
    display:flex; align-items:center; gap:14px;
    padding:12px 16px;
    background:var(--bg2, #141619);
    border-bottom:1px solid var(--border, #26292e);
  }
  .logo{
    font-weight:800; font-size:19px; color:var(--text, #fff); letter-spacing:.02em;
    white-space:nowrap;
  }
  .logo b{font-weight:800; color:var(--accent, #8b909a)}

  #tabs{display:flex; gap:4px}
  .tab{
    font:inherit; font-size:13px; color:var(--muted, #7d838c);
    background:transparent; border:1px solid transparent; border-radius:7px;
    padding:7px 12px; cursor:pointer;
  }
  .tab:hover{color:var(--text, #fff)}
  .tab.active{background:var(--bg3, #1b1d21); color:var(--text, #fff); border-color:var(--border, #2c3036)}

  #search{
    flex:1; max-width:460px; margin:0 auto;
    font:inherit; font-size:14px; color:var(--text, #fff);
    background:var(--bg3, #1b1d21); border:1px solid var(--border, #2c3036); border-radius:9px;
    padding:9px 13px; outline:none;
  }
  #search::placeholder{color:var(--muted, #6b7078)}
  #search:focus{border-color:var(--accent, #454a52)}
  #bar.settings-active #search{display:none}

  @media (max-width:620px){
    .logo{font-size:16px}
    #search{font-size:13px; padding:8px 10px}
    #tabs{gap:2px}
    .tab{padding:6px 9px}
  }

  /* ---------- tab panels ---------- */
  #home{position:absolute; inset:0; overflow:auto}
  .tabpanel{display:none}
  .tabpanel.active{display:block}

  /* ---------- HTMLS grid ---------- */
  #grid{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    padding:18px 18px 46px;
  }
  .card{
    background:var(--bg3, #1b1d21); border-radius:10px; overflow:hidden; cursor:pointer;
    border:1px solid var(--border, #26292e); display:flex; flex-direction:column;
  }
  .card:hover{border-color:var(--accent, #454a52); background:var(--bg3-hover, var(--bg3, #212429))}
  .card:focus-visible{outline:2px solid var(--accent, #6b7280); outline-offset:2px}
  .thumb{
    aspect-ratio:1/1; width:100%; display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:700; color:#fff; overflow:hidden;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .meta{padding:11px 12px}
  .meta .t{font-weight:700; color:var(--text, #fff); font-size:14px; line-height:1.3;
           overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .meta .d{margin-top:4px; font-size:12px; color:var(--muted, #7d838c);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #credit{
    position:fixed; left:16px; bottom:12px; z-index:4;
    font-size:12px; color:var(--muted, #4d525a); pointer-events:none; user-select:none;
  }
  .note{color:var(--muted, #6b7280); font-size:13px; padding:6px 2px}

  /* ---------- generic buttons (settings panel + notes) ---------- */
  .btn{
    font:inherit; font-size:13px; color:var(--text, #ddd);
    background:var(--bg3, #26292e); border:1px solid var(--border, #383c43);
    border-radius:7px; padding:8px 14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--accent, #454a52)}

  footer{margin-top:22px; color:var(--muted, #4d525a); font-size:12px; display:flex; gap:16px; flex-wrap:wrap}
  footer a{color:var(--muted, #6b7280); cursor:pointer; text-decoration:underline}

  /* ---------- settings tab ---------- */
  #tab-settings{padding:28px 18px 60px}
  .settings-wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:30px}
  .settings-wrap section h2{font-size:14px; color:var(--text, #fff); margin:0 0 12px; font-weight:700}
  .settings-wrap section p.sub{margin:-6px 0 12px; font-size:12px; color:var(--muted, #7d838c)}

  #theme-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px}
  .theme-swatch{
    position:relative; border-radius:9px; padding:12px 10px 10px; cursor:pointer;
    border:1px solid; font-size:13px; font-weight:600;
  }
  .theme-swatch.selected{outline:2px solid var(--accent, #7c9cff); outline-offset:2px}
  .theme-swatch .dot{width:14px; height:14px; border-radius:50%; margin-bottom:8px}
  .theme-swatch .theme-del{
    position:absolute; top:4px; right:4px; width:18px; height:18px; line-height:16px;
    border-radius:50%; border:0; background:rgba(0,0,0,.35); color:#fff; cursor:pointer;
    font-size:12px; padding:0;
  }
  .theme-swatch .theme-del:hover{background:rgba(0,0,0,.6)}

  #theme-maker{display:flex; flex-direction:column; gap:14px}
  #tm-name{
    font:inherit; font-size:13px; color:var(--text, #fff);
    background:var(--bg3, #1b1d21); border:1px solid var(--border, #2c3036); border-radius:7px;
    padding:8px 11px; outline:none; max-width:260px;
  }
  .swatch-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px}
  .swatch-row label{
    display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--muted, #7d838c);
  }
  .swatch-row input[type=color]{
    width:100%; height:32px; border:1px solid var(--border, #2c3036); border-radius:6px;
    padding:2px; background:var(--bg3, #1b1d21); cursor:pointer;
  }

  .theme-preview{
    border:1px solid var(--border, #2c3036); border-radius:10px; overflow:hidden; width:230px;
  }
  .tm-bar{height:26px}
  .tm-card{display:flex; gap:9px; padding:11px}
  .tm-card-thumb{width:34px; height:34px; border-radius:6px; flex:none}
  .tm-card-title{font-size:12px; font-weight:700}
  .tm-card-sub{font-size:11px; margin-top:2px}

  .settings-actions{display:flex; gap:10px; flex-wrap:wrap}

  /* ---------- viewer ---------- */
  #viewer{position:absolute; inset:0; display:none; background:#fff}
  #viewer.on{display:block}
  #frame{width:100%; height:100%; border:0; display:block}
  #ctl{
    position:absolute; top:12px; right:12px; z-index:3; display:flex; gap:6px;
    background:rgba(17,18,20,.82); backdrop-filter:blur(6px);
    border:1px solid #33373d; border-radius:8px; padding:5px;
  }
  #ctl button{
    font:inherit; font-size:13px; color:#e6e6e6; background:transparent;
    border:0; border-radius:5px; padding:5px 10px; cursor:pointer;
  }
  #ctl button:hover{background:#2c3037}
  #ctl .close{color:#ff8a8a}
  #ctl:hover{opacity:1}
  #ctl{opacity:.55; transition:opacity .15s}
  #viewer:fullscreen #ctl{display:none}
  #busy{
    position:absolute; inset:0; z-index:2; display:none;
    background:var(--bg, #111214); color:var(--muted, #7d838c); align-items:center; justify-content:center; font-size:13px;
  }
  #busy.on{display:flex}
</style>
</head>
<body>

<div id="home">
  <div id="bar">
    <div class="logo">The&nbsp;<b>Universe</b></div>
    <div id="tabs">
      <button class="tab active" data-tab="htmls" type="button">Games</button>
      <button class="tab" data-tab="settings" type="button">Settings</button>
    </div>
    <input id="search" type="search" placeholder="Search Games..." autocomplete="off" spellcheck="false">
  </div>

  <div id="tab-htmls" class="tabpanel active">
    <div id="grid"></div>
  </div>

  <div id="tab-settings" class="tabpanel">
    <div class="settings-wrap">
      <section>
        <h2>Theme</h2>
        <div id="theme-grid"></div>
      </section>

      <section>
        <h2>Make a theme</h2>
        <p class="sub">Pick colors and save it - it shows up in the theme list above.</p>
        <div id="theme-maker">
          <input id="tm-name" type="text" placeholder="Theme name">
          <div class="swatch-row">
            <label>Background <input id="tm-bg" type="color" value="#111214"></label>
            <label>Bar / panels <input id="tm-bg2" type="color" value="#141619"></label>
            <label>Cards <input id="tm-bg3" type="color" value="#1b1d21"></label>
            <label>Border <input id="tm-border" type="color" value="#2c3036"></label>
            <label>Text <input id="tm-text" type="color" value="#eeeeee"></label>
            <label>Muted text <input id="tm-muted" type="color" value="#7d838c"></label>
            <label>Accent <input id="tm-accent" type="color" value="#7c9cff"></label>
          </div>
          <div id="tm-preview" class="theme-preview">
            <div class="tm-bar"></div>
            <div class="tm-card">
              <div class="tm-card-thumb"></div>
              <div>
                <div class="tm-card-title">Sample card</div>
                <div class="tm-card-sub">this is what it'll look like</div>
              </div>
            </div>
          </div>
          <div>
            <button id="tm-save" class="btn" type="button">Save theme</button>
          </div>
        </div>
      </section>

      <section>
        <h2>Catalog</h2>
        <p class="sub">Re-fetch the HTMLS list.</p>
        <div class="settings-actions">
          <button id="refresh" class="btn" type="button">Refresh catalog</button>
        </div>
      </section>

      <section>
        <h2>Window</h2>
        <div class="settings-actions">
          <button id="blank" class="btn" type="button">Open in about:blank</button>
        </div>
      </section>

    </div>
  </div>

  <div id="credit">made by tasdiam</div>
</div>

<div id="viewer">
  <iframe id="frame" title="Preview"
    sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads"></iframe>
  <div id="ctl">
    <button id="fs">Fullscreen</button>
    <button id="dl">Download</button>
    <button id="close" class="close">Close</button>
  </div>
  <div id="busy">Loading…</div>
</div>

<script>
/* ======================================================================
   Your list lives in a JSON file:  { "Name": "html link", ... }
   An entry can also be an object for a custom tile:
     "Name": { "url": "...", "image": "...", "desc": "subtitle text" }
   ====================================================================== */
const LIST_URL = "https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/tas3.json";
/* ===================================================================== */

/* ======================================================================
   Remote kill switch:  { "isValid": true }  (or false)
   Fetched fresh (no-store, not the jsDelivr CDN) so flipping it takes
   effect immediately instead of waiting out any cache window. Only an
   explicit `false` blocks the page - a network hiccup, missing field, or
   malformed JSON all fail OPEN so a GitHub outage doesn't brick this for
   everyone.
   ====================================================================== */
const STATUS_URL = "https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/status.json";
/* ===================================================================== */

const $ = id => document.getElementById(id);
const grid = $('grid'), home = $('home'), viewer = $('viewer'),
      frame = $('frame'), busy = $('busy'), bar = $('bar');

let entries = {};          // name -> {url, image, desc}
let current = null;        // {name, html}

/* ---------- themes ---------- */
const PRESET_THEMES = [
  { name:'Dark',      bg:'#111214', bg2:'#141619', bg3:'#1b1d21', border:'#2c3036', text:'#eeeeee', muted:'#7d838c', accent:'#8b909a' },
  { name:'Light',         bg:'#f5f5f7', bg2:'#ffffff', bg3:'#ffffff', border:'#e0e0e5', text:'#1a1a1e', muted:'#6b6b75', accent:'#3366ff' }
];
const VARS = ['bg','bg2','bg3','border','text','muted','accent'];

function loadCustomThemes(){
  try { return JSON.parse(localStorage.getItem('universe-custom-themes') || '[]'); }
  catch { return []; }
}
function saveCustomThemes(list){
  localStorage.setItem('universe-custom-themes', JSON.stringify(list));
}
function loadActiveTheme(){
  try { return JSON.parse(localStorage.getItem('universe-active-theme') || 'null'); }
  catch { return null; }
}

function applyTheme(t){
  VARS.forEach(k => document.documentElement.style.setProperty('--' + k, t[k]));
  localStorage.setItem('universe-active-theme', JSON.stringify(t));
  renderThemeGrid();
}

function renderThemeGrid(){
  const themeGrid = $('theme-grid');
  if(!themeGrid) return;
  const active = loadActiveTheme();
  themeGrid.innerHTML = '';
  [...PRESET_THEMES, ...loadCustomThemes()].forEach(t => {
    const el = document.createElement('div');
    el.className = 'theme-swatch' + (active && active.name === t.name ? ' selected' : '');
    el.style.background = t.bg3;
    el.style.borderColor = t.border;
    el.style.color = t.text;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = t.accent;
    const label = document.createElement('div');
    label.textContent = t.name;
    el.append(dot, label);
    el.onclick = () => applyTheme(t);
    if(t.custom){
      const del = document.createElement('button');
      del.className = 'theme-del';
      del.type = 'button';
      del.textContent = '×';
      del.title = 'Delete theme';
      del.onclick = e => {
        e.stopPropagation();
        const list = loadCustomThemes().filter(x => x.name !== t.name);
        saveCustomThemes(list);
        if(active && active.name === t.name) applyTheme(PRESET_THEMES[0]);
        else renderThemeGrid();
      };
      el.append(del);
    }
    themeGrid.append(el);
  });
}

/* theme maker */
const tmInputs = {
  bg: $('tm-bg'), bg2: $('tm-bg2'), bg3: $('tm-bg3'),
  border: $('tm-border'), text: $('tm-text'), muted: $('tm-muted'), accent: $('tm-accent'),
};
function updateMakerPreview(){
  const preview = $('tm-preview');
  preview.style.background = tmInputs.bg.value;
  preview.querySelector('.tm-bar').style.background = tmInputs.bg2.value;
  const card = preview.querySelector('.tm-card');
  card.style.background = tmInputs.bg3.value;
  card.style.borderTop = '1px solid ' + tmInputs.border.value;
  preview.querySelector('.tm-card-thumb').style.background = tmInputs.accent.value;
  preview.querySelector('.tm-card-title').style.color = tmInputs.text.value;
  preview.querySelector('.tm-card-sub').style.color = tmInputs.muted.value;
}
Object.values(tmInputs).forEach(inp => inp.addEventListener('input', updateMakerPreview));
updateMakerPreview();

let makerInitialized = false;
function populateMakerFromActiveTheme(){
  if(makerInitialized) return;
  makerInitialized = true;
  const t = loadActiveTheme() || PRESET_THEMES[0];
  VARS.forEach(k => { if(tmInputs[k]) tmInputs[k].value = t[k]; });
  updateMakerPreview();
}

$('tm-save').onclick = () => {
  const name = ($('tm-name').value || '').trim() || ('Custom ' + (loadCustomThemes().length + 1));
  const t = { name, custom: true };
  VARS.forEach(k => t[k] = tmInputs[k].value);
  const list = loadCustomThemes().filter(x => x.name !== name);
  list.push(t);
  saveCustomThemes(list);
  applyTheme(t);
  $('tm-name').value = '';
};

/* apply saved (or default) theme immediately */
applyTheme(loadActiveTheme() || PRESET_THEMES[0]);

/* ---------- tabs ---------- */
function setTab(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $('tab-htmls').classList.toggle('active', name === 'htmls');
  $('tab-settings').classList.toggle('active', name === 'settings');
  bar.classList.toggle('settings-active', name === 'settings');
  if(name === 'settings'){
    renderThemeGrid();
    populateMakerFromActiveTheme();
  }
}
document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => setTab(btn.dataset.tab));

/* ---------- list ---------- */
async function loadList(){
  grid.innerHTML = '';
  const msg = document.createElement('div');
  msg.className = 'note'; msg.textContent = 'Loading list…';
  grid.append(msg);
  try{
    let text = await grab(LIST_URL);
    if(!text.trim()) text = await grab(bust(LIST_URL));
    if(!text.trim() && toRaw(LIST_URL)) text = await grab(toRaw(LIST_URL));
    if(!text.trim()) throw new Error('empty response');

    const data = JSON.parse(text);
    entries = {};
    for(const [name, v] of Object.entries(data)){
      if(typeof v === 'string' && v.trim()) entries[name] = {url:v};
      else if(v && typeof v === 'object' && v.url) entries[name] = v;
    }
    buildGrid();
  }catch(err){
    grid.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'note';
    box.textContent = 'Could not load list: ' + err.message;
    const retry = document.createElement('button');
    retry.className = 'btn';
    retry.style.marginLeft = '8px';
    retry.textContent = 'Retry';
    retry.onclick = loadList;
    box.append(retry);
    grid.append(box);
  }
}

function buildGrid(){
  const q = ($('search').value || '').trim().toLowerCase();
  grid.innerHTML = '';
  const hits = Object.entries(entries).filter(([name, e]) =>
    !q || name.toLowerCase().includes(q) || (e.desc || '').toLowerCase().includes(q));
  hits.forEach(([name, e]) => grid.append(makeCard(name, e)));

  if(!Object.keys(entries).length){
    const n = document.createElement('div');
    n.className = 'note'; n.textContent = 'The list is empty.';
    grid.append(n);
  } else if(!hits.length){
    const n = document.createElement('div');
    n.className = 'note'; n.textContent = 'Nothing matches "' + $('search').value + '".';
    grid.append(n);
  }
}

$('search').addEventListener('input', buildGrid);

function makeCard(name, e){
  const c = document.createElement('div');
  c.className = 'card'; c.tabIndex = 0;

  const th = document.createElement('div');
  th.className = 'thumb';
  if(e.image){
    const img = new Image();
    img.src = e.image; img.alt = '';
    img.onerror = () => { th.innerHTML = ''; paintInitial(th, name); };
    th.append(img);
  } else paintInitial(th, name);

  const m = document.createElement('div');
  m.className = 'meta';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = name;
  m.append(t);
  if(e.desc){
    const d = document.createElement('div');
    d.className = 'd'; d.textContent = e.desc;
    m.append(d);
  }

  c.append(th, m);
  const go = () => openUrl(e.url, name);
  c.onclick = go;
  c.onkeydown = ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); go(); } };
  return c;
}

function paintInitial(el, name){
  let h = 0;
  for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  el.style.background = 'linear-gradient(150deg, hsl(' + h + ' 70% 48%), hsl(' + ((h + 40) % 360) + ' 72% 34%))';
  el.textContent = name.trim().charAt(0).toUpperCase() || '?';
}

/* ---------- fetching ---------- */
const bust = u => u + (u.includes('?') ? '&' : '?') + 'cb=' + Date.now();

async function grab(url){
  const res = await fetch(url, {cache:'no-store', headers:{'Accept':'text/html,text/plain,*/*'}});
  if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return res.text();
}

function toRaw(url){
  const m = url.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.+)$/);
  return m ? 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + m[4] : null;
}

function withBase(text, url){
  if(/<base\s/i.test(text)) return text;
  const tag = '<base href="' + url.slice(0, url.lastIndexOf('/') + 1) + '">';
  if(/<head[^>]*>/i.test(text)) return text.replace(/<head[^>]*>/i, m => m + tag);
  if(/<html[^>]*>/i.test(text)) return text.replace(/<html[^>]*>/i, m => m + '<head>' + tag + '</head>');
  return tag + text;
}

/* ---------- opening ---------- */
async function openUrl(url, name){
  show(); busy.classList.add('on'); busy.textContent = 'Loading ' + name + '…';
  try{
    let used = url, text = await grab(url);
    if(!text.trim()){ used = bust(url); text = await grab(used); }
    if(!text.trim() && toRaw(url)){ used = toRaw(url); text = await grab(used); }
    if(!text.trim()) throw new Error('server returned an empty body');
    render(withBase(text, used), name);
  }catch(err){
    busy.textContent = 'Failed: ' + err.message;
  }
}

function render(html, name){
  current = {name, html};
  frame.srcdoc = html;
  busy.classList.remove('on');
}

function show(){ viewer.classList.add('on'); home.style.display = 'none'; }

function closeViewer(){
  if(document.fullscreenElement) document.exitFullscreen();
  frame.srcdoc = '';
  current = null;
  viewer.classList.remove('on');
  busy.classList.remove('on');
  home.style.display = '';
}

/* ---------- controls ---------- */
$('close').onclick = closeViewer;

$('dl').onclick = () => {
  if(!current) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([current.html], {type:'text/html'}));
  a.download = /\.x?html?$/i.test(current.name) ? current.name
             : current.name.replace(/[^\w.-]+/g, '_') + '.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
};

function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(current) viewer.requestFullscreen().catch(() => {});
}
$('fs').onclick = toggleFullscreen;
document.addEventListener('fullscreenchange', () => {
  $('fs').textContent = document.fullscreenElement ? 'Exit full' : 'Fullscreen';
});

addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'f' || e.key === 'F'){ if(current) toggleFullscreen(); }
  if(e.key === 'Escape' && !document.fullscreenElement && current) closeViewer();
});

/* ---------- settings actions ---------- */
$('refresh').onclick = loadList;
$('blank').onclick = openAboutBlank;

const nativeOpen = window.open.bind(window);

function openAboutBlank(){
  const w = nativeOpen('about:blank', '_blank');
  if(!w){ alert('Popup blocked - allow popups for this site.'); return; }

  // Clone the page, minus whatever is currently loaded in the iframe and
  // reset to the HTMLS tab, so the copy boots to a clean homepage.
  const root = document.documentElement.cloneNode(true);
  const f = root.querySelector('#frame');
  if(f) f.removeAttribute('srcdoc');
  const v = root.querySelector('#viewer');
  if(v) v.classList.remove('on');
  const h = root.querySelector('#home');
  if(h) h.style.display = '';
  root.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'htmls'));
  const th = root.querySelector('#tab-htmls'); if(th) th.classList.add('active');
  const ts = root.querySelector('#tab-settings'); if(ts) ts.classList.remove('active');

  w.document.open();
  w.document.write('<!DOCTYPE html>' + root.outerHTML);
  w.document.close();
}

/* ---------- kill switch ---------- */
async function checkKillSwitch(){
  try{
    const res = await fetch(STATUS_URL, {cache:'no-store'});
    if(!res.ok) return true; // unreachable - fail open
    const data = await res.json();
    return data && data.isValid !== false; // only an explicit false blocks
  }catch(err){
    return true; // network error / bad JSON - fail open
  }
}
