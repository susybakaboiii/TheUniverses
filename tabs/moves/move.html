<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f3f3f5;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}h1{font-size:26px;font-weight:600}form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0;background:#1d1e22;color:inherit;border:1px solid #36373d;border-radius:10px;padding:12px}button{cursor:pointer;background:#e6e6ec;color:#111214;border:0;border-radius:10px;padding:12px 20px;font:inherit}#status{color:#b4b5bd;min-height:24px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;margin-top:24px}.card{padding:0;background:transparent;color:inherit;text-align:left}.card img,.placeholder{width:100%;aspect-ratio:2/3;object-fit:cover;background:#25262c;border-radius:12px;display:block}.card strong{display:block;margin-top:10px;font-size:15px}.card:hover img{filter:brightness(1.15)}dialog{width:min(950px,96vw);background:#18191c;color:inherit;border:1px solid #34353a;border-radius:16px;padding:18px}dialog::backdrop{background:#000c}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}video{display:block;width:100%;max-height:70vh;margin:16px 0;background:#000}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls button{background:#303139;color:inherit;padding:8px 14px}button:disabled{opacity:.45;cursor:default}#playStatus{color:#b4b5bd}small{color:#b4b5bd}
</style>
<main><h1>Movies</h1><p id="status" role="status">Loading videos…</p><div id="grid"></div></main>
<dialog id="player"><div class="bar"><strong id="title"></strong><button id="close" aria-label="Close player">Close</button></div><video id="video" controls playsinline></video><div class="controls"><button id="prev">Previous part</button><span id="part"></span><button id="next">Next part</button><button id="retry">Retry</button></div><p id="playStatus" role="status"></p></dialog>
<script>
// Set this to your hosted JSON URL to load automatically on opening.
const CATALOG_URL = 'https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/tabs/moves/videos.json';
const $ = id => document.getElementById(id);
let catalogAbort, playbackAbort, session=0, selected, partIndex=0;
const blobs=new Map();
function httpURL(value,base){if(typeof value!=='string')throw Error('URLs must be strings.');const u=new URL(value,base);if(!['http:','https:'].includes(u.protocol))throw Error('Use HTTP or HTTPS URLs.');return u.href;}
function normalize(data,base){const rows=Array.isArray(data)?data:Array.isArray(data?.videos)?data.videos:[data];if(!rows.length)throw Error('No videos found.');return rows.map((v,i)=>{if(!v||typeof v.name!=='string'||!Array.isArray(v.parts)||!v.parts.length)throw Error(`Video ${i+1} needs name and a nonempty parts array.`);return {name:v.name,poster:v.poster?httpURL(v.poster,base):'',parts:v.parts.map(p=>httpURL(p,base))};});}
async function loadCatalog(address){catalogAbort?.abort();const controller=new AbortController();catalogAbort=controller;$('status').textContent='Loading videos…';try{const endpoint=httpURL(address);const response=await fetch(endpoint,{signal:controller.signal,cache:'no-cache'});if(!response.ok)throw Error(`JSON request failed (${response.status}).`);const videos=normalize(await response.json(),response.url||endpoint);if(controller!==catalogAbort)return;$('grid').replaceChildren();for(const entry of videos){const button=document.createElement('button');button.className='card';if(entry.poster){const img=document.createElement('img');img.src=entry.poster;img.alt=entry.name;img.loading='lazy';button.append(img);}else{const block=document.createElement('div');block.className='placeholder';button.append(block);}const label=document.createElement('strong');label.textContent=entry.name;button.append(label);button.onclick=()=>openVideo(entry);$('grid').append(button);}$('status').textContent=`${videos.length} video${videos.length===1?'':'s'}`;}catch(e){if(e.name!=='AbortError'&&controller===catalogAbort)$('status').textContent=e.message+' Check the URL and the host’s CORS settings.';}}
function cleanup(){session++;playbackAbort?.abort();$('video').pause();$('video').removeAttribute('src');$('video').load();for(const p of blobs.values())p.then(u=>URL.revokeObjectURL(u)).catch(()=>{});blobs.clear();}
function download(i){if(blobs.has(i))return blobs.get(i);const signal=playbackAbort.signal;const promise=fetch(selected.parts[i],{signal}).then(async r=>{if(!r.ok)throw Error(`Part ${i+1} request failed (${r.status}).`);const blob=await r.blob();if(signal.aborted)throw new DOMException('Cancelled','AbortError');return URL.createObjectURL(blob);});blobs.set(i,promise);promise.catch(()=>{if(blobs.get(i)===promise)blobs.delete(i);});return promise;}
async function playPart(i){if(!selected||i<0||i>=selected.parts.length)return;partIndex=i;const token=++session;$('video').pause();$('playStatus').textContent=`Downloading part ${i+1}…`;$('part').textContent=`${i+1} / ${selected.parts.length}`;$('prev').disabled=i===0;$('next').disabled=i===selected.parts.length-1;try{const url=await download(i);if(token!==session)return;$('video').src=url;$('video').load();$('playStatus').textContent='';try{await $('video').play();}catch(e){if(token===session)$('playStatus').textContent='Press play to continue.';}if(token!==session)return;if(i+1<selected.parts.length)download(i+1).catch(()=>{});for(const [key,p] of blobs){if(key!==i&&key!==i+1){blobs.delete(key);p.then(u=>URL.revokeObjectURL(u)).catch(()=>{});}}}catch(e){if(token===session&&e.name!=='AbortError')$('playStatus').textContent=e.message+' Check the part URL and CORS, then retry.';}}
function openVideo(entry){cleanup();selected=entry;playbackAbort=new AbortController();$('title').textContent=entry.name;$('video').poster=entry.poster;if(!$('player').open)$('player').showModal();playPart(0);}
$('close').onclick=()=>$('player').close();$('player').addEventListener('close',()=>{cleanup();selected=null;});$('prev').onclick=()=>playPart(partIndex-1);$('next').onclick=()=>playPart(partIndex+1);$('retry').onclick=()=>{blobs.delete(partIndex);playPart(partIndex);};$('video').onended=()=>{if(selected&&partIndex+1<selected.parts.length)playPart(partIndex+1);else $('playStatus').textContent='Video finished.';};$('video').onerror=()=>{if(selected)$('playStatus').textContent='This part could not be played. Use individually playable video files in a browser-supported format.';};
loadCatalog(CATALOG_URL);
</script>
</html>
