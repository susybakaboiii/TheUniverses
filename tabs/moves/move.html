<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111214;color:#f3f3f5;font:16px system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:36px 24px}
h1{font-size:26px;font-weight:600}
button{cursor:pointer;background:#e6e6ec;color:#111214;border:0;border-radius:10px;padding:12px 20px;font:inherit}
#status{color:#b4b5bd;min-height:24px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;margin-top:24px}
.card{padding:0;background:transparent;color:inherit;text-align:left}
.card img,.placeholder{width:100%;aspect-ratio:2/3;object-fit:cover;background:#25262c;border-radius:12px;display:block}
.card strong{display:block;margin-top:10px;font-size:15px}
.card:hover img{filter:brightness(1.15)}

dialog{width:min(1100px,96vw);background:#18191c;color:inherit;border:1px solid #34353a;border-radius:16px;padding:16px}
dialog::backdrop{background:#000d}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar button{background:#303139;color:inherit;padding:8px 14px}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:76vh;margin-top:12px;background:#000;border-radius:12px;overflow:hidden;user-select:none}
.stage:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border-radius:0;margin:0}
.stage:-webkit-full-screen{width:100vw;height:100vh;max-height:none;border-radius:0;margin:0}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage video.hidden{visibility:hidden}
.stage.idle{cursor:none}

.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;text-align:center;padding:20px}
.spin{display:none;width:46px;height:46px;border:4px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
.loading .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
#msg{margin:0;color:#ddd;font-size:14px;text-shadow:0 1px 3px #000}
.err #msg{background:#000b;padding:10px 14px;border-radius:10px}
#retry{pointer-events:auto;padding:8px 16px}

.ctl{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 8px;background:linear-gradient(transparent,#000d);transition:opacity .25s}
.idle .ctl{opacity:0;pointer-events:none}
.seek{position:relative;height:18px;display:flex;align-items:center;cursor:pointer}
.track{position:absolute;left:0;right:0;height:4px;background:#ffffff38;border-radius:3px;overflow:hidden;transition:height .12s}
.seek:hover .track{height:6px}
.buf,.played{position:absolute;top:0;bottom:0;left:0;width:0}
.buf{background:#ffffff5c}
.played{background:#fff}
.knob{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;transform:translateX(-50%);left:0;pointer-events:none}
.tip{position:absolute;bottom:20px;transform:translateX(-50%);background:#000d;color:#fff;font-size:12px;padding:3px 7px;border-radius:6px;display:none;pointer-events:none;font-variant-numeric:tabular-nums}
.seek:hover .tip{display:block}
.seek input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}

.row{display:flex;align-items:center;gap:4px;margin-top:4px}
.row button{background:transparent;color:#fff;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600;line-height:1}
.row button:hover{background:#ffffff22}
.row svg{width:22px;height:22px;display:block;fill:currentColor}
#vol{width:80px;accent-color:#fff;margin:0 6px 0 0}
.time{font-size:13px;color:#e4e4e8;font-variant-numeric:tabular-nums;margin-left:6px;white-space:nowrap}
.spacer{flex:1}
#note{color:#c4c5cc;font-size:12px;white-space:nowrap;margin-right:6px}
@media (max-width:600px){#vol,#note,#back,#fwd{display:none}}
</style>

<main>
  <h1>Movies | Test</h1>
  <p id="status" role="status">Loading videos…</p>
  <div id="grid"></div>
</main>

<dialog id="player" aria-label="Video player">
  <div class="bar"><strong id="title"></strong><button id="close" aria-label="Close player">Close</button></div>
  <div class="stage" id="stage">
    <video id="va" playsinline preload="auto"></video>
    <video id="vb" playsinline preload="auto" class="hidden"></video>
    <div class="center" id="center"><div class="spin"></div><p id="msg" role="status"></p><button id="retry" hidden>Retry</button></div>
    <div class="ctl">
      <div class="seek" id="seekWrap">
        <div class="track"><div class="buf" id="buf"></div><div class="played" id="played"></div></div>
        <div class="knob" id="knob"></div>
        <div class="tip" id="tip">0:00</div>
        <input id="seek" type="range" min="0" max="1000" step="0.1" value="0" aria-label="Seek">
      </div>
      <div class="row">
        <button id="play" aria-label="Play / pause"></button>
        <button id="back" aria-label="Back 10 seconds">−10</button>
        <button id="fwd" aria-label="Forward 10 seconds">+10</button>
        <button id="mute" aria-label="Mute"></button>
        <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="Volume">
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <small id="note"></small>
        <button id="speed" aria-label="Playback speed">1×</button>
        <button id="fs" aria-label="Fullscreen"></button>
      </div>
    </div>
  </div>
</dialog>

<script>
// Set this to your hosted JSON URL to load automatically on opening.
const CATALOG_URL = 'https://cdn.jsdelivr.net/gh/susybakaboiii/TheUniverses@main/tabs/moves/videos.json';
// Start downloading the next part when this many seconds are left in the current one.
// Parts shorter than this start downloading the next part right away.
const PREFETCH_LEAD = 45;

const $ = id => document.getElementById(id);
const vids = [$('va'), $('vb')];
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M15.5 9.5l5 5m0-5-5 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
  fs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="fill:none"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>'
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

/* ---------- Catalog ---------- */
let catalogAbort;
function httpURL(value, base) { if (typeof value !== 'string') throw Error('URLs must be strings.'); const u = new URL(value, base); if (!['http:', 'https:'].includes(u.protocol)) throw Error('Use HTTP or HTTPS URLs.'); return u.href; }
function normalize(data, base) {
  const rows = Array.isArray(data) ? data : Array.isArray(data?.videos) ? data.videos : [data];
  if (!rows.length) throw Error('No videos found.');
  return rows.map((v, i) => {
    if (!v || typeof v.name !== 'string' || !Array.isArray(v.parts) || !v.parts.length) throw Error(`Video ${i + 1} needs name and a nonempty parts array.`);
    return { name: v.name, poster: v.poster ? httpURL(v.poster, base) : '', parts: v.parts.map(p => httpURL(p, base)) };
  });
}
async function loadCatalog(address) {
  catalogAbort?.abort(); const controller = new AbortController(); catalogAbort = controller;
  $('status').textContent = 'Loading videos…';
  try {
    const endpoint = httpURL(address);
    const response = await fetch(endpoint, { signal: controller.signal, cache: 'no-cache' });
    if (!response.ok) throw Error(`JSON request failed (${response.status}).`);
    const videos = normalize(await response.json(), response.url || endpoint);
    if (controller !== catalogAbort) return;
    $('grid').replaceChildren();
    for (const entry of videos) {
      const button = document.createElement('button'); button.className = 'card';
      if (entry.poster) { const img = document.createElement('img'); img.src = entry.poster; img.alt = entry.name; img.loading = 'lazy'; button.append(img); }
      else { const block = document.createElement('div'); block.className = 'placeholder'; button.append(block); }
      const label = document.createElement('strong'); label.textContent = entry.name; button.append(label);
      button.onclick = () => openVideo(entry);
      $('grid').append(button);
    }
    $('status').textContent = `${videos.length} video${videos.length === 1 ? '' : 's'}`;
  } catch (e) {
    if (e.name !== 'AbortError' && controller === catalogAbort) $('status').textContent = e.message + ' Check the URL and the host’s CORS settings.';
  }
}

/* ---------- Player state ---------- */
// Two <video> elements: the active one plays, the standby one holds the next part
// fully preloaded so the switch at the end of each part is instant.
let sel = null, durs = [], cur = 0, act = 0, gen = 0, sw = 0;
let hold = null;        // global time to display while a part switch is in progress
let intent = false;     // whether the viewer wants playback running
let prefetchedFor = -1, scrubbing = false, lastSave = 0, ticker = 0, retryAt = null, idleT = 0;
let volume = store.get('mv:vol', 1), muted = store.get('mv:muted', false), rate = 1;
const blobs = new Map(); // part index -> {promise, url, loaded, size, ctrl}
const A = () => vids[act], S = () => vids[1 - act];

// Durations: unknown parts are estimated from the average of known ones.
function est(i) { if (durs[i] > 0) return durs[i]; const k = durs.filter(d => d > 0); return k.length ? k.reduce((a, b) => a + b) / k.length : 0; }
function offset(i) { let t = 0; for (let j = 0; j < i; j++) t += est(j); return t; }
const total = () => offset(durs.length);
const now = () => offset(cur) + (A().currentTime || 0);
function partAt(t) { let o = 0; for (let i = 0; i < durs.length; i++) { const d = est(i); if (t < o + d || i === durs.length - 1) return [i, Math.max(0, t - o)]; o += d; } return [0, 0]; }

// Read each part's duration (metadata only, a few KB each) so the seek bar covers the whole movie.
function probe(g) {
  const queue = sel.parts.map((_, i) => i);
  const worker = async () => {
    while (queue.length && g === gen) {
      const i = queue.shift(); if (durs[i] > 0) continue;
      const d = await probeOne(sel.parts[i]);
      if (g === gen && !(durs[i] > 0)) { durs[i] = d; render(); }
    }
  };
  for (let k = 0; k < 3; k++) worker();
}
function probeOne(url) {
  return new Promise(res => {
    const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true;
    const done = d => { clearTimeout(t); v.removeAttribute('src'); v.load(); res(d); };
    const t = setTimeout(() => done(0), 20000);
    v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : 0);
    v.onerror = () => done(0);
    v.src = url;
  });
}

/* ---------- Downloading parts ---------- */
function fetchPart(i) {
  if (!sel || i < 0 || i >= sel.parts.length) return null;
  if (blobs.has(i)) return blobs.get(i).promise;
  const rec = { url: null, loaded: 0, size: 0, ctrl: new AbortController() };
  const address = sel.parts[i];
  rec.promise = (async () => {
    const r = await fetch(address, { signal: rec.ctrl.signal });
    if (!r.ok) throw Error(`Part ${i + 1} request failed (${r.status}).`);
    rec.size = +r.headers.get('content-length') || 0;
    const ct = r.headers.get('content-type') || '';
    const opts = ct.startsWith('video/') ? { type: ct } : {};
    let blob;
    if (r.body?.getReader) {
      const reader = r.body.getReader(), chunks = [];
      for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); rec.loaded += value.byteLength; }
      blob = new Blob(chunks, opts);
    } else blob = await r.blob();
    if (rec.ctrl.signal.aborted) throw new DOMException('Cancelled', 'AbortError');
    return (rec.url = URL.createObjectURL(blob));
  })();
  rec.promise.catch(() => { if (blobs.get(i) === rec) blobs.delete(i); });
  blobs.set(i, rec);
  return rec.promise;
}
function dropBlob(k) { const r = blobs.get(k); if (!r) return; blobs.delete(k); r.ctrl.abort(); if (r.url) URL.revokeObjectURL(r.url); }
function prune() { for (const k of [...blobs.keys()]) if (k !== cur && k !== cur + 1) dropBlob(k); }
const srcFor = i => blobs.get(i)?.url || sel.parts[i];

function prepareNext() {
  const n = cur + 1, g = gen;
  if (!sel || n >= sel.parts.length) return;
  fetchPart(n).then(url => {
    if (g !== gen || hold != null || cur + 1 !== n) return;
    const s = S();
    if (s.dataset.part !== String(n)) { s.dataset.part = n; s.src = url; s.load(); }
  }).catch(() => {});
  render();
}

function once(el, ev) {
  return new Promise((res, rej) => {
    const ok = () => { off(); res(); }, bad = () => { off(); rej(el.error || Error('load failed')); };
    function off() { el.removeEventListener(ev, ok); el.removeEventListener('error', bad); }
    el.addEventListener(ev, ok); el.addEventListener('error', bad);
  });
}

// Load part i into the standby element at local time t, then swap it in.
async function switchTo(i, t = 0) {
  const my = ++sw, g = gen, old = A(), nv = S();
  const live = () => my === sw && g === gen;
  hold = offset(i) + t; cur = i; prefetchedFor = -1;
  old.pause(); hideError(); setLoading(true); render();
  try {
    const rec = blobs.get(i);
    if (rec && !rec.url && nv.dataset.part !== String(i)) { try { await rec.promise; } catch {} if (!live()) return; }
    if (nv.dataset.part !== String(i) || nv.error) { nv.dataset.part = i; nv.src = srcFor(i); nv.load(); }
    if (nv.readyState < 1) await once(nv, 'loadedmetadata');
    if (!live()) return;
    if (nv.duration > 0) durs[i] = nv.duration;
    if (Math.abs(nv.currentTime - t) > 0.05) { nv.currentTime = t; await once(nv, 'seeked'); if (!live()) return; }
  } catch (e) {
    if (live()) showError(`Part ${i + 1} couldn’t be loaded. Each part must be a playable video file.`, i, t);
    return;
  }
  applyAudio(nv);
  act = 1 - act; hold = null;
  nv.classList.remove('hidden'); old.classList.add('hidden');
  old.removeAttribute('src'); delete old.dataset.part; old.load();
  prune();
  if (intent) nv.play().catch(() => { intent = false; render(); });
  setLoading(intent && nv.readyState < 3);
  render();
  if (nv.duration - nv.currentTime <= PREFETCH_LEAD) { prefetchedFor = cur; prepareNext(); }
}

function seekGlobal(t) {
  if (!sel) return; const T = total(); if (!T) return;
  t = Math.max(0, Math.min(T - 0.5, t));
  const [i, local] = partAt(t);
  if (hold == null && !retryAt && i === cur && A().dataset.part === String(i)) { A().currentTime = local; render(); }
  else switchTo(i, local);
}

function togglePlay() {
  if (!sel) return; const v = A();
  if (hold != null) { intent = !intent; render(); return; }
  if (v.ended && cur === sel.parts.length - 1) { intent = true; switchTo(0, 0); return; }
  if (v.paused) { intent = true; v.play().catch(() => { intent = false; render(); }); }
  else { intent = false; v.pause(); }
  render();
}

/* ---------- UI ---------- */
function setLoading(on) { $('center').classList.toggle('loading', on); if (!on && !retryAt) $('msg').textContent = ''; }
function showError(text, i, t) { retryAt = { i, t }; setLoading(false); $('msg').textContent = text; $('retry').hidden = false; $('center').classList.add('err'); }
function hideError() { retryAt = null; $('retry').hidden = true; $('center').classList.remove('err'); $('msg').textContent = ''; }
function setPlayed(f) { $('played').style.width = f * 100 + '%'; $('knob').style.left = f * 100 + '%'; }

function render() {
  if (!sel) return;
  const T = total(), t = hold ?? now(), v = A();
  if (!scrubbing) { const f = T ? Math.min(1, t / T) : 0; $('seek').value = f * 1000; setPlayed(f); $('time').textContent = `${fmt(t)} / ${fmt(T)}`; }
  // Buffered: what the active part has loaded, extended over the next part once it's fully downloaded.
  let b = t;
  if (hold == null) {
    let end = 0;
    for (let k = 0; k < v.buffered.length; k++) if (v.buffered.start(k) <= v.currentTime + 0.5) end = Math.max(end, v.buffered.end(k));
    b = offset(cur) + end;
    if (blobs.get(cur + 1)?.url && end >= est(cur) - 1) b = offset(cur + 2);
  }
  $('buf').style.width = (T ? Math.min(1, b / T) * 100 : 0) + '%';
  const playing = hold != null ? intent : !v.paused;
  if ($('play').dataset.s !== String(playing)) { $('play').dataset.s = playing; $('play').innerHTML = playing ? ICON.pause : ICON.play; }
  const n = sel.parts.length, r = blobs.get(cur + 1);
  let note = n > 1 ? `Part ${cur + 1}/${n}` : '';
  if (r) note += r.url ? ' · next ready' : r.size ? ` · next ${Math.floor(r.loaded / r.size * 100)}%` : ' · loading next';
  $('note').textContent = note;
  if (hold != null && !retryAt) { const rc = blobs.get(cur); $('msg').textContent = rc && !rc.url && rc.size ? `Loading part ${cur + 1}… ${Math.floor(rc.loaded / rc.size * 100)}%` : ''; }
}

function applyAudio(v) { v.volume = volume; v.muted = muted; v.defaultPlaybackRate = rate; v.playbackRate = rate; }
function renderAudio() { $('mute').innerHTML = muted || volume === 0 ? ICON.mute : ICON.vol; $('vol').value = muted ? 0 : volume; $('speed').textContent = rate + '×'; vids.forEach(applyAudio); store.set('mv:vol', volume); store.set('mv:muted', muted); }
function setVolume(x) { volume = Math.max(0, Math.min(1, x)); muted = volume === 0; renderAudio(); }

function toggleFs() {
  const st = $('stage');
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (st.requestFullscreen) st.requestFullscreen().catch(() => {});
  else if (st.webkitRequestFullscreen) st.webkitRequestFullscreen();
  else A().webkitEnterFullscreen?.();
}
function wake() {
  const st = $('stage'); st.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (sel && !A().paused && hold == null) st.classList.add('idle'); }, 2500);
}

const posKey = () => 'mv:pos:' + sel.name;
function savePos(force) {
  if (!sel || hold != null) return;
  const n = Date.now(); if (!force && n - lastSave < 4000) return; lastSave = n;
  const t = A().currentTime || 0;
  if (cur === 0 && t < 5) store.del(posKey()); else store.set(posKey(), { p: cur, t });
}

/* ---------- Video events (only the active element counts) ---------- */
for (const v of vids) {
  v.addEventListener('timeupdate', () => {
    if (v !== A() || hold != null) return;
    const left = v.duration - v.currentTime;
    if (isFinite(left) && left <= PREFETCH_LEAD && prefetchedFor !== cur) { prefetchedFor = cur; prepareNext(); }
    render(); savePos();
  });
  v.addEventListener('ended', () => {
    if (v !== A() || hold != null) return;
    if (cur + 1 < sel.parts.length) switchTo(cur + 1, 0);
    else { intent = false; store.del(posKey()); setLoading(false); $('stage').classList.remove('idle'); render(); }
  });
  v.addEventListener('play', () => { if (v === A() && hold == null) { intent = true; render(); wake(); } });
  v.addEventListener('pause', () => { if (v === A() && hold == null && !v.ended) { intent = false; savePos(true); render(); wake(); } });
  v.addEventListener('waiting', () => { if (v === A() && hold == null) setLoading(true); });
  v.addEventListener('playing', () => { if (v === A()) setLoading(false); });
  v.addEventListener('canplay', () => { if (v === A() && hold == null) setLoading(false); });
  v.addEventListener('progress', () => { if (v === A()) render(); });
  v.addEventListener('loadedmetadata', () => { if ('part' in v.dataset && v.duration > 0) { durs[+v.dataset.part] = v.duration; render(); } });
  v.addEventListener('error', () => {
    if (!sel || !v.getAttribute('src')) return;
    if (v === A() && hold == null) showError(`Part ${cur + 1} stopped playing.`, cur, v.currentTime || 0);
    else if (v === S() && hold == null) delete v.dataset.part;
  });
  v.addEventListener('click', togglePlay);
  v.addEventListener('dblclick', toggleFs);
}

/* ---------- Opening / closing ---------- */
function cleanup() {
  if (sel) savePos(true);
  gen++; sw++; hold = null; clearInterval(ticker);
  for (const k of [...blobs.keys()]) dropBlob(k);
  for (const v of vids) { v.pause(); v.removeAttribute('src'); delete v.dataset.part; v.load(); }
  hideError(); setLoading(false);
}
function openVideo(entry) {
  cleanup();
  sel = entry; durs = entry.parts.map(() => 0); cur = 0; act = 0; intent = true; prefetchedFor = -1;
  vids[0].classList.remove('hidden'); vids[1].classList.add('hidden');
  for (const v of vids) { if (entry.poster) v.poster = entry.poster; else v.removeAttribute('poster'); applyAudio(v); }
  $('title').textContent = entry.name;
  if (!$('player').open) $('player').showModal();
  const saved = store.get(posKey(), null);
  let p = 0, t = 0;
  if (saved && saved.p >= 0 && saved.p < entry.parts.length) { p = saved.p; t = Math.max(0, saved.t - 3); }
  probe(gen);
  ticker = setInterval(render, 500);
  wake();
  switchTo(p, t);
}

$('close').onclick = () => $('player').close();
$('player').addEventListener('close', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  cleanup(); sel = null;
});
$('retry').onclick = () => {
  if (!retryAt) return; const { i, t } = retryAt;
  hideError(); dropBlob(i);
  const s = S(); s.removeAttribute('src'); delete s.dataset.part; s.load();
  intent = true; switchTo(i, t);
};
$('play').onclick = togglePlay;
$('back').onclick = () => seekGlobal((hold ?? now()) - 10);
$('fwd').onclick = () => seekGlobal((hold ?? now()) + 10);
$('mute').onclick = () => { muted = !muted; if (!muted && volume === 0) volume = 0.5; renderAudio(); };
$('vol').oninput = e => setVolume(+e.target.value);
$('speed').onclick = () => { const r = [1, 1.25, 1.5, 2, 0.75]; rate = r[(r.indexOf(rate) + 1) % r.length]; renderAudio(); };
$('fs').onclick = toggleFs;

const seek = $('seek');
seek.addEventListener('input', () => { scrubbing = true; const f = seek.value / 1000, T = total(); setPlayed(f); $('time').textContent = `${fmt(f * T)} / ${fmt(T)}`; });
seek.addEventListener('change', () => { scrubbing = false; seekGlobal(seek.value / 1000 * total()); });
$('seekWrap').addEventListener('pointermove', e => {
  const r = e.currentTarget.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  $('tip').style.left = f * 100 + '%'; $('tip').textContent = fmt(f * total());
});
$('stage').addEventListener('pointermove', wake);
$('stage').addEventListener('pointerdown', wake);

document.addEventListener('keydown', e => {
  if (!$('player').open || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = hold ?? now();
  switch (e.key) {
    case ' ': case 'k': case 'K': togglePlay(); break;
    case 'ArrowLeft': case 'j': case 'J': seekGlobal(t - 10); break;
    case 'ArrowRight': case 'l': case 'L': seekGlobal(t + 10); break;
    case 'ArrowUp': setVolume((muted ? 0 : volume) + 0.1); break;
    case 'ArrowDown': setVolume((muted ? 0 : volume) - 0.1); break;
    case 'f': case 'F': toggleFs(); break;
    case 'm': case 'M': $('mute').click(); break;
    default: return;
  }
  e.preventDefault(); wake();
});

$('fs').innerHTML = ICON.fs;
renderAudio();
loadCatalog(CATALOG_URL);
</script>
</html>
