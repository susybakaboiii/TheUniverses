        <div id=dlOverlay>
            <div id=dlBox>
                <div id=dlTitle>Preparing download…</div>

                <div id=dlDetail></div>
                <div id=dlError></div>

        <script>
            const dlTitle = document.getElementById("dlTitle");
            const dlBar = document.getElementById("dlBar");
            const dlDetail = document.getElementById("dlDetail");
            const dlError = document.getElementById("dlError");
            const dlOverlay = document.getElementById("dlOverlay");

            function mb(bytes) {
                return (bytes / 1048576).toFixed(1) + " MB";
            }

            function setProgress(percent) {
                if (percent == null) {
                    dlBar.classList.add("indeterminate");
                    dlBar.style.width = "";
                } else {
                    dlBar.classList.remove("indeterminate");
                    dlBar.style.width = Math.min(100, percent).toFixed(1) + "%";
                }
            }

            // Download one part, reporting progress as it streams in
            async function fetchPartWithProgress(url, index, total) {
                dlTitle.textContent = "Downloading part " + (index + 1) + " of " + total + "…";
                setProgress(0);
                dlDetail.textContent = "";

                const response = await fetch(url);
                if (!response.ok) throw new Error("Part " + (index + 1) + " failed (HTTP " + response.status + ")");

                const size = parseInt(response.headers.get("Content-Length"), 10) || 0;

                // Fallback for browsers without streaming support
                if (!response.body || !response.body.getReader) {
                    setProgress(null);
                    const buf = await response.arrayBuffer();
                    dlDetail.textContent = mb(buf.byteLength) + " downloaded";
                    return buf;
                }

                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;

                    if (size) {
                        const pct = received / size * 100;
                        setProgress(pct);
                        dlDetail.textContent = mb(received) + " / " + mb(size) + " (" + Math.floor(pct) + "%)";
                    } else {
                        setProgress(null);
                        dlDetail.textContent = mb(received) + " downloaded";
                    }
                }

                return new Blob(chunks);
            }

            async function mergeFiles(fileParts) {
                const pieces = [];
                for (let i = 0; i < fileParts.length; i++) {
                    pieces.push(await fetchPartWithProgress(fileParts[i], i, fileParts.length));
                }
                return URL.createObjectURL(new Blob(pieces));
            }

            function getParts(file, start, end) {
                let parts = [];
                for (let i = start; i <= end; i++) {
                    parts.push(file + ".part" + i);
                }
                return parts;
            }

            mergeFiles(getParts("game.zip", 1, 2)).then(async url => {
                window.gameZipUrl = url;
                dlTitle.textContent = "Download complete — starting game…";
                setProgress(100);
                dlDetail.textContent = "";

                let renpypre = document.createElement("script");
                renpypre.src = "https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@725a19f20c3f376529284c9f86299581719e8d19/class-of-09/renpy-pre.js"
                let renpy = document.createElement("script");
                renpy.src = "https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@725a19f20c3f376529284c9f86299581719e8d19/class-of-09/renpy.js"
                renpy.onload = () => {
                    // Hand the screen over to Ren'Py once its engine script is in
                    dlOverlay.classList.add("fade");
                    setTimeout(() => dlOverlay.remove(), 500);
                };
                renpy.onerror = () => {
                    dlError.textContent = "Couldn't load the game engine. Try refreshing.";
                };
                document.body.appendChild(renpypre);
                document.body.appendChild(renpy);
            }).catch(err => {
                dlTitle.textContent = "Download failed";
                setProgress(0);
                dlError.textContent = (err && err.message ? err.message : err) + " — try refreshing the page.";
            });
        </script>
